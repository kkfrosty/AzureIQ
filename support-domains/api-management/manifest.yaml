schemaVersion: 1

supportDomain:
  name: api-management
  displayName: Azure API Management
  version: 0.2.0
  status: observed
  owners: []
  reviewedAt: 2026-07-24
  reviewExpiresAt: 2026-10-19

value:
  proofStatus: value-demonstrated
  baselineProvider: Azure MCP and installed Azure diagnostic skills
  baselineStatus: completed
  comparisonResultReference: live unexpected-response diagnosis on 2026-07-24 against apim-wf-nter65xq with a Container Apps backend
  retentionDecision: keep
  hypotheses:
    - id: apim-gateway-log-query-precision
      observedGap: true
      statement: A schema-verified support-domain query may improve APIM gateway evidence retrieval when a generic MCP-generated query selects an incorrect table, field, scope, or payload-heavy projection.
      artifacts:
        - queries/request-evidence.kql
        - ../azure-monitor/queries/distributed-trace-correlation.kql
        - ../container-apps/queries/platform-evidence.kql
        - runbooks/unexpected-response.md
      acceptanceCriteria:
        - Use the correct resource-specific APIM gateway table and fields for the target workspace schema.
        - Constrain resource, UTC window, correlation, API, and operation scope without exposing request or response payloads.
        - Distinguish gateway, backend, policy, cache, and pre-APIM hypotheses without unsupported root-cause claims.
        - Require fewer corrective prompts than the baseline while preserving or improving evidence completeness.
      result: value-demonstrated
      evidence:
        - AppLens is the registered platform baseline and produced no evidence: it failed twice for the APIM resource with BadRequest and does not support Container Apps backends.
        - A natural-language Resource Graph request was mistranslated into an unrelated webtests query and returned zero rows, which could have been misread as missing topology.
        - ResponseCode versus BackendResponseCode localized both failures to the backend on the first scoped query.
        - Azure MCP monitoring alone could reach the same answer, but only after choosing the correct workspace, tables, and join key, which the pack now records.
    - id: apim-change-and-verification-safety
      observedGap: false
      statement: AzureIQ change planning and independent verification may reduce unsafe or unverifiable APIM policy remediation compared with an unconstrained tool-driven workflow.
      artifacts:
        - runbooks/unexpected-response.md
        - ../../schemas/action-manifest.schema.json
      acceptanceCriteria:
        - Bind a proposed policy change to exact scope, revision, risk, approval, rollback, and expiration.
        - Refuse execution while the repository write policy is deny.
        - Verify the expected data-plane response and adjacent regression signals rather than relying on deployment success.
      result: unproven

azure:
  resourceTypes:
    - Microsoft.ApiManagement/service
  targetResourceIds: []
  supportedEnvironments:
    - non-production
  validatedSkus:
    - Developer
  validatedGateways:
    - managed
  validatedApiVersions: []
  validatedBackends:
    - Microsoft.App/containerApps

tooling:
  preferred:
    - AppLens detector diagnosis for supported resource types
    - Azure MCP diagnostics and monitoring
    - Azure API Management VS Code extension for interactive APIM workflows
    - Azure Resource Graph and Activity Log
    - versioned infrastructure as code
  fallbacks:
    - API Management ARM REST API
    - Azure CLI after installation and validation
    - supervised Azure portal workflow
  limitations:
    - No generic API Management MCP management router was observed in the current session.
    - No local Azure CLI, Azure Developer CLI, Bicep CLI, or Terraform CLI was observed.
    - VS Code policy step debugging requires a Developer-tier APIM service, service-owner access, and the built-in all-access subscription under current Microsoft guidance.
    - AppLens exposes one conversational diagnose command rather than an enumerable detector list, and it supports only microsoft.web/sites, microsoft.containerservice/managedclusters, and microsoft.apimanagement/service in this environment.
    - AppLens failed twice for the validated Developer-tier APIM service with "Failed to create diagnostics session ... BadRequest", so detector coverage cannot be assumed available.
    - Container Apps backends support neither AppLens nor Resource Health here; Resource Health returned 422 and detector diagnosis is unsupported.
    - The dedicated activity-log command can fail on credentials or DNS while Azure Monitor log queries still succeed; a control-plane read failure is not evidence about the incident.
    - A natural-language Azure Resource Graph request can be mistranslated into an unrelated query; verify the returned KQL before treating zero rows as topology evidence.

operability:
  requiredDecisions:
    - service tier and capacity model
    - zone and multi-region topology
    - managed versus self-hosted gateway
    - workspace usage
    - public or private network model
    - identity and backend authentication model
    - certificate and custom-domain ownership
    - infrastructure-as-code implementation
    - recovery objectives and promotion model
  requiredControls:
    - least-privilege read, change, and verify identities
    - Key Vault for secret material
    - versioned policies and effective-policy review
    - revisions or equivalent safe promotion strategy
    - dependency and backend health evidence
    - rollback and independent data-plane verification

observability:
  discoverDiagnosticCategoriesAtRuntime: true
  activityLogExportRequired: true
  resourceSpecificTablesPreferred: true
  expectedTables:
    - ApiManagementGatewayLogs
  workspaceTopology:
    multiWorkspaceLikely: true
    note: APIM gateway logs and Application Insights may live in a different workspace than the Container Apps managed-environment system logs; resolve each table's workspace before querying.
  correlationKeys:
    gatewayRequestId: ApiManagementGatewayLogs.CorrelationId
    note: Cross-service distributed trace correlation is owned by the azure-monitor support domain.
  applicationInsights:
    requiredDecision: true
    managedIdentityPreferred: true
    bodyLoggingDefault: false
  requestTracing:
    externalTraceHeader: Apim-Debug-Authorization
    traceIdResponseHeader: Apim-Trace-Id
    legacySubscriptionTraceSupported: false
    tokenPersistenceAllowed: false
    workspaceSupport: unavailable-as-of-review

runbooks:
  - id: apim-unexpected-response
    path: runbooks/unexpected-response.md
    status: observed
    diagnosticRiskTier: R0
    automaticRemediationEligible: false

queries:
  - id: apim-request-evidence
    path: queries/request-evidence.kql
    status: observed
collaborations:
  - pack: azure-monitor
    artifacts:
      - queries/distributed-trace-correlation.kql
    purpose: Correlate instrumented gateway and backend spans by OperationId.
  - pack: container-apps
    artifacts:
      - queries/platform-evidence.kql
    purpose: Explain revision, replica, scaling, startup, and restart behavior when APIM implicates the backend.
sources:
  - title: Monitor API Management
    url: https://learn.microsoft.com/azure/api-management/monitor-api-management
  - title: API Management request tracing
    url: https://learn.microsoft.com/azure/api-management/api-management-howto-api-inspector
  - title: Application Insights integration
    url: https://learn.microsoft.com/azure/api-management/api-management-howto-app-insights
  - title: ApiManagementGatewayLogs table
    url: https://learn.microsoft.com/azure/azure-monitor/reference/tables/apimanagementgatewaylogs